<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4d"/>
      <stop offset="1" stop-color="#0a0f21"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e03bff"/>
      <stop offset="1" stop-color="#7d36c4"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ff4ff"/>
      <stop offset="1" stop-color="#1fc8e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#2ee6f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee6f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="190" fill="url(#glow)"/>

  <!-- shield outline: escrow protection -->
  <path d="M256 60 L416 118 V268 C416 356 346 420 256 456 C166 420 96 356 96 268 V118 Z"
        fill="none" stroke="#2ee6f0" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>

  <!-- GenLayer style A shards -->
  <g transform="translate(256 262) scale(0.62) translate(-250 -291)">
    <polygon points="230,108 230,240 165,375 228,408 55,475" fill="url(#purple)"/>
    <polygon points="268,108 268,240 333,375 272,408 445,475" fill="url(#purple)"/>
    <!-- keyhole core: the sealed delivery -->
    <circle cx="249" cy="312" r="21" fill="url(#cyan)"/>
    <polygon points="238,322 260,322 270,372 228,372" fill="url(#cyan)"/>
  </g>

  <!-- seal dots -->
  <circle cx="150" cy="150" r="5" fill="#2ee6f0"/>
  <circle cx="362" cy="150" r="5" fill="#2ee6f0"/>
</svg>
